<!DOCTYPE html>
<html>
    <head lang="BR-en">
      <meta charset="utf-8">

      <style>
        .container {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
}

.box {
  color: lightblue;
  padding: 20px;

}

.grid-container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;  
}

.item {
  color: lightgreen;
  padding: 20px;
}

.row {
  display: flex;
  gap: 10px;
}

.Box {
  background: orange;
  padding: 20px;
}

      </style>
    </head>

    <body>

<div>
<div class="container">
  <div class="box" style="background-color: brown;">One yen yen yeneyeneyeyeyy</div>
  <div class="box" style="background-color: lightgoldenrodyellow; ">Two yen yen yeneyeneyeheehdfj</div>
  <div class="box" style="background-color: lightcoral ;">Three yen yen eynenennnneneeneeneneneenene</div>
</div>

<div class="grid-container" style="background-color:lightseagreen;">
  <div class="item" style="background-color:lightskyblue;">One</div>
  <div class="item" style="background-color:lightslategray;">Two</div>
  <div class="item">Three</div>
</div>

<div class="row">
  <div class="Box">Box 1</div>
  <div class="Box">Box 2</div>
</div>
</div>

    </body>
</html>
